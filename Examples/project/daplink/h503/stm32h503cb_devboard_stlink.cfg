# On-board or external ST-LINK for STM32H503CBT6 over SWD.
#
# STM32H5 support in ST's OpenOCD bundle is built around the newer ST-LINK
# DAP driver, so use stlink-dap + dapdirect_swd here instead of the older
# hla transport path.
#
# This target requires an OpenOCD build that ships STM32H5 support
# (target/stm32h5x.cfg + stm32h5x flash driver), such as ST's CubeIDE bundle.

source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
adapter speed 1000

if {[catch {source [find target/stm32h5x.cfg]} err]} {
    echo "Error: STM32H5 target support is not available in this OpenOCD package."
    echo "Hint : use ST's OpenOCD build from STM32CubeIDE / STM32CubeCLT."
    echo "Detail: $err"
    shutdown
}
