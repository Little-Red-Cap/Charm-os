name: minimal-kernel-runtime-system-compiler-witness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/minimal-kernel-runtime-system-compiler-witness.yml
      - scripts/minimal_kernel_runtime_system_compiler_witness_bundle.ps1
      - scripts/ci_minimal_kernel_runtime_system_compiler_witness_bundle.ps1
      - scripts/compare_system_compiler_world.py
      - scripts/export_system_compiler_biography.py
      - scripts/check_system_compiler_biography_index_summary.ps1
      - scripts/assemble_system_compiler_world_shelf.ps1
      - scripts/export_system_compiler_biography_index.py
      - scripts/compare_system_compiler_biography_index.py
      - scripts/validate_system_compiler_biography.py
      - scripts/validate_system_compiler_biography_index.py
      - scripts/validate_system_compiler_biography_index_compare.py
      - scripts/check_system_compiler_biography_index_compare_summary.ps1
      - scripts/check_system_compiler_biography_summary.ps1
      - scripts/export_system_compiler_witness_bundle.ps1
      - scripts/validate_system_compiler_witness_bundle.py
      - scripts/validate_system_compiler_world_compare.py
      - scripts/minimal_kernel_runtime_evidence_bundle.ps1
      - scripts/validate_minimal_kernel_runtime_evidence.py
      - scripts/ci_minimal_kernel_runtime_host_smoke_bundle.ps1
      - scripts/daily_minimal_kernel_runtime_host_smoke_bundle.ps1
      - scripts/minimal_kernel_runtime_host_smoke_dual_bundle.ps1
      - scripts/minimal_kernel_runtime_host_smoke_bundle.ps1
      - scripts/minimal_kernel_runtime_host_smoke.ps1
      - scripts/minimal_kernel_runtime_host_smoke_ci.ps1
      - scripts/minimal_kernel_runtime_host_smoke_daily.ps1
      - scripts/inspect_minimal_kernel_runtime_host_smoke.ps1
      - scripts/report_minimal_kernel_runtime_host_smoke.ps1
      - scripts/check_minimal_kernel_runtime_host_smoke_summary.ps1
      - scripts/minimal_kernel_runtime_armv7a_qemu_smoke.ps1
      - scripts/minimal_kernel_runtime_armv7a_qemu_smoke_bundle.ps1
      - scripts/report_minimal_kernel_runtime_armv7a_qemu_smoke.ps1
      - scripts/check_minimal_kernel_runtime_armv7a_qemu_smoke_summary.ps1
      - Examples/kernel/canonical_worlds/**
      - Examples/kernel/runtime*_host/**
      - Examples/kernel/armv7a/qemu/**
      - Modules/core/**
      - Modules/io/out/**
      - Modules/system/kernel/**
      - targets/armv7a/**
      - cmake/**
      - schemas/minimal_kernel.runtime_evidence_bundle.summary.v1.schema.json
      - schemas/system_compiler.canonical_world.v0.schema.json
      - schemas/system_compiler.biography.v0.schema.json
      - schemas/system_compiler.biography_index.v0.schema.json
      - schemas/system_compiler.biography_index_compare.v0.schema.json
      - schemas/system_compiler.witness_bundle.v0.schema.json
      - schemas/system_compiler.world_compare.v0.schema.json
      - schemas/examples/system_compiler.witness_bundle.v0*.json
      - schemas/examples/system_compiler.world_compare.v0.sample.json
      - docs/system/system_compiler_biography_v0.md
      - docs/system/system_compiler_biography_index_v0.md
      - docs/system/system_compiler_biography_index_compare_v0.md

permissions:
  contents: read

jobs:
  minimal_kernel_runtime_system_compiler_witness:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Arm GNU Toolchain 15.2.rel1
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "15.2.Rel1"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup MSYS2 (CLANG64)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          cache: true
          cache-key: msys2-${{ runner.os }}-clang64-minimal-kernel-runtime-system-compiler-witness
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-qemu

      - name: Expose CLANG64 tools to PowerShell
        shell: pwsh
        run: |
          $clangBin = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "clang64\bin"
          if (-not (Test-Path $clangBin)) {
            throw "missing CLANG64 bin: $clangBin"
          }

          $clangBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify toolchain
        shell: pwsh
        run: |
          python --version
          arm-none-eabi-gcc --version
          clang++ --version
          cmake --version
          ninja --version
          qemu-system-arm --version

      - name: Install witness validator dependency
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check jsonschema

      - name: Run minimal kernel runtime system compiler witness bundle
        shell: pwsh
        run: |
          ./scripts/ci_minimal_kernel_runtime_system_compiler_witness_bundle.ps1 `
            -OutputRoot out/minimal-kernel-runtime-system-compiler-witness `
            -Clean `
            -HostExamples runtime_minimal_host `
            -HostJobs 8 `
            -QemuBuildJobs 8 `
            -QemuTailLines 20

      - name: Check witness biography without compare
        shell: pwsh
        run: |
          ./scripts/check_system_compiler_biography_summary.ps1 `
            -Summary out/minimal-kernel-runtime-system-compiler-witness/biography.summary.json `
            -RequireVerdict not-attached `
            -MaxRequiredMissing 0

      - name: Run runtime witness self compare smoke
        shell: pwsh
        run: |
          ./scripts/ci_minimal_kernel_runtime_system_compiler_witness_bundle.ps1 `
            -RuntimeEvidenceSummary out/minimal-kernel-runtime-system-compiler-witness/runtime_evidence/summary.json `
            -BaselineRuntimeEvidenceSummary out/minimal-kernel-runtime-system-compiler-witness/runtime_evidence/summary.json `
            -OutputRoot out/minimal-kernel-runtime-system-compiler-witness/self-compare `
            -Clean

      - name: Check witness self compare biography
        shell: pwsh
        run: |
          ./scripts/check_system_compiler_biography_summary.ps1 `
            -Summary out/minimal-kernel-runtime-system-compiler-witness/self-compare/biography.summary.json `
            -RequireWorldCompareResult ok `
            -RequireVerdict standing `
            -MaxRequiredMissing 0 `
            -MaxRegressions 0 `
            -MaxRequiredRegressions 0 `
            -RequireCollapseSurfaceUnchanged

      - name: Assemble witness world shelf
        shell: pwsh
        run: |
          ./scripts/assemble_system_compiler_world_shelf.ps1 `
            -SearchRoot out/minimal-kernel-runtime-system-compiler-witness `
            -OutputRoot out/minimal-kernel-runtime-system-compiler-witness/world-shelf `
            -Profile minimal-kernel-runtime-system-compiler-witness-shelf `
            -RequireBiographyCount 2 `
            -RequireUniqueWorldCount 1 `
            -RequireOkCount 2 `
            -MaxFailCount 0 `
            -RequireCompareAttachedCount 1 `
            -RequireNotAttachedCount 1 `
            -RequireStandingCount 1 `
            -RequireImprovedCount 0 `
            -RequireDriftedCount 0 `
            -RequireCollapsedCount 0

      - name: Assemble witness baseline shelf
        shell: pwsh
        run: |
          ./scripts/assemble_system_compiler_world_shelf.ps1 `
            -BiographySummary out/minimal-kernel-runtime-system-compiler-witness/biography.summary.json `
            -OutputRoot out/minimal-kernel-runtime-system-compiler-witness/world-shelf-baseline `
            -Profile minimal-kernel-runtime-system-compiler-witness-shelf `
            -RequireBiographyCount 1 `
            -RequireUniqueWorldCount 1 `
            -RequireOkCount 1 `
            -MaxFailCount 0 `
            -RequireCompareAttachedCount 0 `
            -RequireNotAttachedCount 1 `
            -RequireStandingCount 0 `
            -RequireImprovedCount 0 `
            -RequireDriftedCount 0 `
            -RequireCollapsedCount 0

      - name: Compare witness shelves
        shell: pwsh
        run: |
          python ./scripts/compare_system_compiler_biography_index.py `
            --baseline out/minimal-kernel-runtime-system-compiler-witness/world-shelf-baseline/biography.index.summary.json `
            --candidate out/minimal-kernel-runtime-system-compiler-witness/world-shelf/biography.index.summary.json `
            --output-root out/minimal-kernel-runtime-system-compiler-witness/world-shelf-compare

          python ./scripts/validate_system_compiler_biography_index_compare.py `
            --bundle-root out/minimal-kernel-runtime-system-compiler-witness/world-shelf-compare

      - name: Check witness shelf compare
        shell: pwsh
        run: |
          ./scripts/check_system_compiler_biography_index_compare_summary.ps1 `
            -Summary out/minimal-kernel-runtime-system-compiler-witness/world-shelf-compare/summary.json `
            -RequireVerdict improved `
            -MaxRegressions 0 `
            -RequireAddedEntries 1 `
            -RequireRemovedEntries 0 `
            -RequireChangedEntries 1 `
            -RequireImprovementCount 1 `
            -RequireAddedWorlds 0 `
            -RequireRemovedWorlds 0 `
            -MaxAddedFailedEntries 0

      - name: Run sample world compare smoke
        shell: pwsh
        run: |
          python ./scripts/compare_system_compiler_world.py `
            --baseline schemas/examples/system_compiler.witness_bundle.v0.sample.json `
            --candidate schemas/examples/system_compiler.witness_bundle.v0.candidate_drift.sample.json `
            --output-root out/minimal-kernel-runtime-system-compiler-witness/world-compare-sample

          python ./scripts/validate_system_compiler_world_compare.py `
            --bundle-root out/minimal-kernel-runtime-system-compiler-witness/world-compare-sample

      - name: Publish minimal kernel runtime system compiler witness report
        if: always()
        shell: pwsh
        run: |
          $reportCandidates = @(
            "out/minimal-kernel-runtime-system-compiler-witness/world-shelf-compare/report.md",
            "out/minimal-kernel-runtime-system-compiler-witness/world-shelf/biography.index.report.md",
            "out/minimal-kernel-runtime-system-compiler-witness/self-compare/biography.report.md",
            "out/minimal-kernel-runtime-system-compiler-witness/self-compare/report.md",
            "out/minimal-kernel-runtime-system-compiler-witness/biography.report.md",
            "out/minimal-kernel-runtime-system-compiler-witness/report.md"
          )
          $checkCandidates = @(
            "out/minimal-kernel-runtime-system-compiler-witness/world-shelf-compare/check.txt",
            "out/minimal-kernel-runtime-system-compiler-witness/world-shelf/biography.index.check.txt",
            "out/minimal-kernel-runtime-system-compiler-witness/self-compare/biography.check.txt",
            "out/minimal-kernel-runtime-system-compiler-witness/self-compare/check.txt",
            "out/minimal-kernel-runtime-system-compiler-witness/biography.check.txt",
            "out/minimal-kernel-runtime-system-compiler-witness/check.txt"
          )

          foreach ($reportPath in $reportCandidates) {
            if (Test-Path $reportPath) {
              Get-Content -LiteralPath $reportPath -Raw -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              return
            }
          }

          foreach ($checkPath in $checkCandidates) {
            if (Test-Path $checkPath) {
              @(
                "## Minimal Kernel Runtime System Compiler Witness"
                ""
                "Root report was not generated. Fallback check output:"
                ""
                "```text"
                (Get-Content -LiteralPath $checkPath -Raw -Encoding utf8)
                "```"
              ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              return
            }
          }

          "## Minimal Kernel Runtime System Compiler Witness`n`nReport not generated.`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Upload minimal kernel runtime system compiler witness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-kernel-runtime-system-compiler-witness
          path: out/minimal-kernel-runtime-system-compiler-witness
          if-no-files-found: error
