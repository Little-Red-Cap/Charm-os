name: Minimal Kernel Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimal-kernel-runtime:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Arm GNU Toolchain 15.2.rel1
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "15.2.Rel1"

      - name: Setup MSYS2 (CLANG64 + QEMU)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          cache: true
          cache-key: msys2-${{ runner.os }}-clang64-minimal-kernel-runtime
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-qemu

      - name: Add CLANG64 tools to PATH
        shell: pwsh
        run: |
          'C:\msys64\clang64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show tool versions
        shell: pwsh
        run: |
          Get-Command cmake, clang, ninja, qemu-system-arm, arm-none-eabi-gcc | `
            Select-Object Name, Source | `
            Format-Table -AutoSize

          cmake --version
          clang --version
          ninja --version
          qemu-system-arm --version
          arm-none-eabi-gcc --version

      - name: Run minimal kernel runtime smoke
        shell: pwsh
        run: |
          ./scripts/minimal_kernel_runtime_smoke.ps1 `
            -CMakeExe cmake `
            -QemuExe qemu-system-arm `
            -Generator Ninja `
            -BuildJobs 1
