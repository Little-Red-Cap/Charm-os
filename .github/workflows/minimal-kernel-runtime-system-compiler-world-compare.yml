name: minimal-kernel-runtime-system-compiler-world-compare

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/minimal-kernel-runtime-system-compiler-world-compare.yml
      - scripts/minimal_kernel_runtime_system_compiler_witness_bundle.ps1
      - scripts/ci_minimal_kernel_runtime_system_compiler_world_compare.ps1
      - scripts/ci_minimal_kernel_runtime_system_compiler_witness_bundle.ps1
      - scripts/ci_minimal_kernel_runtime_evidence_bundle.ps1
      - scripts/minimal_kernel_runtime_evidence_bundle.ps1
      - scripts/validate_minimal_kernel_runtime_evidence.py
      - scripts/export_system_compiler_biography.py
      - scripts/check_system_compiler_biography_index_summary.ps1
      - scripts/assemble_system_compiler_world_shelf.ps1
      - scripts/export_system_compiler_biography_index.py
      - scripts/compare_system_compiler_biography_index.py
      - scripts/export_system_compiler_witness_bundle.ps1
      - scripts/check_system_compiler_biography_summary.ps1
      - scripts/validate_system_compiler_biography.py
      - scripts/validate_system_compiler_biography_index.py
      - scripts/validate_system_compiler_biography_index_compare.py
      - scripts/validate_system_compiler_witness_bundle.py
      - scripts/compare_system_compiler_world.py
      - scripts/validate_system_compiler_world_compare.py
      - scripts/check_system_compiler_biography_index_compare_summary.ps1
      - scripts/check_system_compiler_world_compare_summary.ps1
      - scripts/ci_minimal_kernel_runtime_host_smoke_bundle.ps1
      - scripts/daily_minimal_kernel_runtime_host_smoke_bundle.ps1
      - scripts/minimal_kernel_runtime_host_smoke_dual_bundle.ps1
      - scripts/minimal_kernel_runtime_host_smoke_bundle.ps1
      - scripts/minimal_kernel_runtime_host_smoke.ps1
      - scripts/minimal_kernel_runtime_host_smoke_ci.ps1
      - scripts/minimal_kernel_runtime_host_smoke_daily.ps1
      - scripts/inspect_minimal_kernel_runtime_host_smoke.ps1
      - scripts/report_minimal_kernel_runtime_host_smoke.ps1
      - scripts/check_minimal_kernel_runtime_host_smoke_summary.ps1
      - scripts/minimal_kernel_runtime_armv7a_qemu_smoke.ps1
      - scripts/minimal_kernel_runtime_armv7a_qemu_smoke_bundle.ps1
      - scripts/report_minimal_kernel_runtime_armv7a_qemu_smoke.ps1
      - scripts/check_minimal_kernel_runtime_armv7a_qemu_smoke_summary.ps1
      - Examples/kernel/canonical_worlds/**
      - Examples/kernel/runtime*_host/**
      - Examples/kernel/armv7a/qemu/**
      - Modules/core/**
      - Modules/io/out/**
      - Modules/system/kernel/**
      - targets/armv7a/**
      - cmake/**
      - schemas/minimal_kernel.runtime_evidence_bundle.summary.v1.schema.json
      - schemas/system_compiler.canonical_world.v0.schema.json
      - schemas/system_compiler.biography.v0.schema.json
      - schemas/system_compiler.biography_index.v0.schema.json
      - schemas/system_compiler.biography_index_compare.v0.schema.json
      - schemas/system_compiler.witness_bundle.v0.schema.json
      - schemas/system_compiler.world_compare.v0.schema.json
      - docs/system/system_compiler_biography_v0.md
      - docs/system/system_compiler_biography_index_v0.md
      - docs/system/system_compiler_biography_index_compare_v0.md

permissions:
  contents: read

jobs:
  minimal_kernel_runtime_system_compiler_world_compare:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Arm GNU Toolchain 15.2.rel1
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "15.2.Rel1"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup MSYS2 (CLANG64)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          cache: true
          cache-key: msys2-${{ runner.os }}-clang64-minimal-kernel-runtime-system-compiler-world-compare
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-qemu

      - name: Expose CLANG64 tools to PowerShell
        shell: pwsh
        run: |
          $clangBin = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "clang64\bin"
          if (-not (Test-Path $clangBin)) {
            throw "missing CLANG64 bin: $clangBin"
          }

          $clangBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify toolchain
        shell: pwsh
        run: |
          python --version
          arm-none-eabi-gcc --version
          clang++ --version
          cmake --version
          ninja --version
          qemu-system-arm --version

      - name: Install compare validator dependency
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check jsonschema

      - name: Run minimal kernel runtime system compiler world compare
        shell: pwsh
        run: |
          ./scripts/ci_minimal_kernel_runtime_system_compiler_world_compare.ps1 `
            -OutputRoot out/minimal-kernel-runtime-system-compiler-world-compare `
            -Clean `
            -HostExamples runtime_minimal_host `
            -HostJobs 8 `
            -QemuBuildJobs 8 `
            -QemuTailLines 20

      - name: Check world compare standing verdict
        shell: pwsh
        run: |
          ./scripts/check_system_compiler_world_compare_summary.ps1 `
            -Summary out/minimal-kernel-runtime-system-compiler-world-compare/world_compare/summary.json `
            -RequireVerdict standing `
            -MaxRegressions 0 `
            -MaxRequiredRegressions 0 `
            -MaxAddedMissingContractRefs 0

      - name: Check world compare biography
        shell: pwsh
        run: |
          ./scripts/check_system_compiler_biography_summary.ps1 `
            -Summary out/minimal-kernel-runtime-system-compiler-world-compare/biography.summary.json `
            -RequireWorldCompareResult ok `
            -RequireVerdict standing `
            -MaxRequiredMissing 0 `
            -MaxRegressions 0 `
            -MaxRequiredRegressions 0 `
            -RequireCollapseSurfaceUnchanged

      - name: Assemble world compare shelf
        shell: pwsh
        run: |
          ./scripts/assemble_system_compiler_world_shelf.ps1 `
            -SearchRoot out/minimal-kernel-runtime-system-compiler-world-compare `
            -OutputRoot out/minimal-kernel-runtime-system-compiler-world-compare/world-shelf `
            -Profile minimal-kernel-runtime-system-compiler-world-compare-shelf `
            -RequireBiographyCount 1 `
            -RequireUniqueWorldCount 1 `
            -RequireOkCount 1 `
            -MaxFailCount 0 `
            -RequireCompareAttachedCount 1 `
            -RequireNotAttachedCount 0 `
            -RequireStandingCount 1 `
            -RequireImprovedCount 0 `
            -RequireDriftedCount 0 `
            -RequireCollapsedCount 0

      - name: Compare world compare shelf against itself
        shell: pwsh
        run: |
          python ./scripts/compare_system_compiler_biography_index.py `
            --baseline out/minimal-kernel-runtime-system-compiler-world-compare/world-shelf/biography.index.summary.json `
            --candidate out/minimal-kernel-runtime-system-compiler-world-compare/world-shelf/biography.index.summary.json `
            --output-root out/minimal-kernel-runtime-system-compiler-world-compare/world-shelf-compare

          python ./scripts/validate_system_compiler_biography_index_compare.py `
            --bundle-root out/minimal-kernel-runtime-system-compiler-world-compare/world-shelf-compare

      - name: Check world compare shelf compare
        shell: pwsh
        run: |
          ./scripts/check_system_compiler_biography_index_compare_summary.ps1 `
            -Summary out/minimal-kernel-runtime-system-compiler-world-compare/world-shelf-compare/summary.json `
            -RequireVerdict standing `
            -MaxRegressions 0 `
            -RequireAddedEntries 0 `
            -RequireRemovedEntries 0 `
            -RequireChangedEntries 0 `
            -RequireImprovementCount 0 `
            -RequireAddedWorlds 0 `
            -RequireRemovedWorlds 0 `
            -MaxAddedFailedEntries 0

      - name: Publish minimal kernel runtime system compiler world compare report
        if: always()
        shell: pwsh
        run: |
          $shelfCompareReportPath = "out/minimal-kernel-runtime-system-compiler-world-compare/world-shelf-compare/report.md"
          $shelfCompareCheckPath = "out/minimal-kernel-runtime-system-compiler-world-compare/world-shelf-compare/check.txt"
          $shelfReportPath = "out/minimal-kernel-runtime-system-compiler-world-compare/world-shelf/biography.index.report.md"
          $shelfCheckPath = "out/minimal-kernel-runtime-system-compiler-world-compare/world-shelf/biography.index.check.txt"
          $biographyReportPath = "out/minimal-kernel-runtime-system-compiler-world-compare/biography.report.md"
          $biographyCheckPath = "out/minimal-kernel-runtime-system-compiler-world-compare/biography.check.txt"
          $compareReportPath = "out/minimal-kernel-runtime-system-compiler-world-compare/world_compare/report.md"
          $compareCheckPath = "out/minimal-kernel-runtime-system-compiler-world-compare/world_compare/check.txt"
          $rootReportPath = "out/minimal-kernel-runtime-system-compiler-world-compare/report.md"

          if (Test-Path $shelfCompareReportPath) {
            Get-Content -LiteralPath $shelfCompareReportPath -Raw -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            if (Test-Path $shelfReportPath) {
              "`n---`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              Get-Content -LiteralPath $shelfReportPath -Raw -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
            if (Test-Path $compareReportPath) {
              "`n---`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              Get-Content -LiteralPath $compareReportPath -Raw -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
            return
          }

          if (Test-Path $shelfReportPath) {
            Get-Content -LiteralPath $shelfReportPath -Raw -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            if (Test-Path $compareReportPath) {
              "`n---`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              Get-Content -LiteralPath $compareReportPath -Raw -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
            return
          }

          if (Test-Path $biographyReportPath) {
            Get-Content -LiteralPath $biographyReportPath -Raw -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            if (Test-Path $compareReportPath) {
              "`n---`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              Get-Content -LiteralPath $compareReportPath -Raw -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
            return
          }

          if (Test-Path $compareReportPath) {
            Get-Content -LiteralPath $compareReportPath -Raw -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            if (Test-Path $rootReportPath) {
              "`n---`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              Get-Content -LiteralPath $rootReportPath -Raw -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
            return
          }

          if (Test-Path $shelfCompareCheckPath) {
            @(
              "## Minimal Kernel Runtime System Compiler World Shelf Compare"
              ""
              "Shelf compare report was not generated. Fallback check output:"
              ""
              "```text"
              (Get-Content -LiteralPath $shelfCompareCheckPath -Raw -Encoding utf8)
              "```"
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            return
          }

          if (Test-Path $shelfCheckPath) {
            @(
              "## Minimal Kernel Runtime System Compiler World Shelf"
              ""
              "Shelf report was not generated. Fallback check output:"
              ""
              "```text"
              (Get-Content -LiteralPath $shelfCheckPath -Raw -Encoding utf8)
              "```"
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            return
          }

          if (Test-Path $biographyCheckPath) {
            @(
              "## Minimal Kernel Runtime System Compiler Biography"
              ""
              "Biography report was not generated. Fallback check output:"
              ""
              "```text"
              (Get-Content -LiteralPath $biographyCheckPath -Raw -Encoding utf8)
              "```"
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            return
          }

          if (Test-Path $compareCheckPath) {
            @(
              "## Minimal Kernel Runtime System Compiler World Compare"
              ""
              "Compare report was not generated. Fallback check output:"
              ""
              "```text"
              (Get-Content -LiteralPath $compareCheckPath -Raw -Encoding utf8)
              "```"
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            return
          }

          "## Minimal Kernel Runtime System Compiler World Compare`n`nReport not generated.`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload minimal kernel runtime system compiler world compare artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-kernel-runtime-system-compiler-world-compare
          path: out/minimal-kernel-runtime-system-compiler-world-compare
          if-no-files-found: error
