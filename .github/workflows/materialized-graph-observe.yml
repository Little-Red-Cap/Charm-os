name: Materialized Graph Observe

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/materialized-graph-observe.yml'
      - 'Modules/init/**'
      - 'Modules/system/**'
      - 'Modules/io/**'
      - 'Modules/usb/**'
      - 'Examples/init/**'
      - 'Examples/usb/usb_host_runtime_multi_smoke/**'
      - 'Examples/usb/usb_msc_block_demo/**'
      - 'scripts/*materialized_graph*.ps1'
      - 'scripts/*artifact_report*.ps1'
      - 'scripts/validate_materialized_graph_artifacts.py'
      - 'schemas/**'

permissions:
  contents: read

jobs:
  materialized-graph-observe:
    runs-on: windows-latest
    env:
      BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'refs/heads/main' }}

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_REF }}
          path: baseline

      - name: Setup MSYS2 (CLANG64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          cache: true
          cache-key: msys2-${{ runner.os }}-clang64-materialized-graph
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-libc++

      - name: Add CLANG64 tools to PATH
        shell: pwsh
        run: |
          'C:\msys64\clang64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show tool versions
        shell: pwsh
        run: |
          cmake --version
          clang --version
          ninja --version
          python --version

      - name: Install schema validator dependency
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check jsonschema pyyaml

      - name: Export baseline bundle
        shell: pwsh
        working-directory: baseline
        run: |
          ./scripts/export_materialized_graph.ps1 -AllCases -OutputRoot ../out/materialized-graph-baseline

      - name: Export candidate bundle and build report
        shell: pwsh
        working-directory: candidate
        run: |
          ./scripts/ci_materialized_graph_bundle.ps1 `
            -BaselineBundleRoot ../out/materialized-graph-baseline `
            -AllCases `
            -OutputRoot ../out/materialized-graph-ci

      - name: Run runtime plane smoke
        shell: pwsh
        working-directory: candidate
        run: |
          ./scripts/materialized_graph_runtime_plane_smoke.ps1 `
            -BundleRoot ../out/materialized-graph-ci/bundle-current `
            -OutputRoot ../out/materialized-graph-runtime-plane-smoke

      - name: Run resource contract smoke
        shell: pwsh
        working-directory: candidate
        run: |
          ./scripts/materialized_graph_resource_contract_smoke.ps1 `
            -ArtifactRoot ../out/materialized-graph-ci/artifact-report `
            -Case bringup-minimal-observe-demo `
            -OutputRoot ../out/materialized-graph-resource-contract-smoke

      - name: Run resource contract matrix smoke
        shell: pwsh
        working-directory: candidate
        run: |
          ./scripts/materialized_graph_resource_contract_matrix_smoke.ps1 `
            -ArtifactRoot ../out/materialized-graph-ci/artifact-report `
            -OutputRoot ../out/materialized-graph-resource-contract-matrix-smoke

      - name: Run bringup evidence matrix smoke
        shell: pwsh
        working-directory: candidate
        run: |
          ./scripts/materialized_graph_bringup_evidence_matrix_smoke.ps1 `
            -ArtifactRoot ../out/materialized-graph-ci/artifact-report `
            -OutputRoot ../out/materialized-graph-bringup-evidence-matrix-smoke

      - name: Run resource contract compare smoke
        shell: pwsh
        working-directory: candidate
        run: |
          ./scripts/materialized_graph_resource_contract_compare_smoke.ps1 `
            -BundleRoot ../out/materialized-graph-ci/bundle-current `
            -OutputRoot ../out/materialized-graph-resource-contract-compare-smoke

      - name: Run bringup evidence compare smoke
        shell: pwsh
        working-directory: candidate
        run: |
          ./scripts/materialized_graph_bringup_evidence_compare_smoke.ps1 `
            -BundleRoot ../out/materialized-graph-ci/bundle-current `
            -OutputRoot ../out/materialized-graph-bringup-evidence-compare-smoke

      - name: Run resource contract compare root smoke
        shell: pwsh
        working-directory: candidate
        run: |
          ./scripts/materialized_graph_resource_contract_compare_root_smoke.ps1 `
            -BundleRoot ../out/materialized-graph-ci/bundle-current `
            -OutputRoot ../out/materialized-graph-resource-contract-compare-root-smoke

      - name: Run bringup evidence compare root smoke
        shell: pwsh
        working-directory: candidate
        run: |
          ./scripts/materialized_graph_bringup_evidence_compare_root_smoke.ps1 `
            -BundleRoot ../out/materialized-graph-ci/bundle-current `
            -OutputRoot ../out/materialized-graph-bringup-evidence-compare-root-smoke

      - name: Validate materialized graph artifacts
        shell: pwsh
        working-directory: candidate
        run: |
          python ./scripts/validate_materialized_graph_artifacts.py `
            --bundle-root ../out/materialized-graph-baseline `
            --ci-output-root ../out/materialized-graph-ci `
            ../out/materialized-graph-runtime-plane-smoke/runtime_plane_diff.json `
            ../out/materialized-graph-runtime-plane-smoke/report/materialized_graph_bundle_diff_report.manifest.json `
            ../out/materialized-graph-resource-contract-compare-smoke/artifact-report/bringup-minimal-observe-demo.artifact_report.json `
            ../out/materialized-graph-resource-contract-compare-smoke/resource_contract_compare.diff.json `
            ../out/materialized-graph-bringup-evidence-compare-smoke/artifact-report/bringup-minimal-observe-demo.artifact_report.json `
            ../out/materialized-graph-bringup-evidence-compare-smoke/bringup_evidence_compare.diff.json

      - name: Publish workflow summary
        shell: pwsh
        working-directory: candidate
        run: |
          function Format-CountMap($map) {
            if ($null -eq $map) {
              return '<none>'
            }

            $parts = @()
            foreach ($property in $map.PSObject.Properties) {
              $parts += "$($property.Name)=$($property.Value)"
            }

            if ($parts.Count -eq 0) {
              return '<none>'
            }

            return ($parts -join ', ')
          }

          $summary = Get-Content -LiteralPath ../out/materialized-graph-ci/summary.json -Raw -Encoding utf8 | ConvertFrom-Json
          $diff = $summary.diff
          $runtimePlane = Get-Content -LiteralPath ../out/materialized-graph-runtime-plane-smoke/runtime_plane_smoke.summary.json -Raw -Encoding utf8 | ConvertFrom-Json
          $resourceContract = Get-Content -LiteralPath ../out/materialized-graph-resource-contract-smoke/resource_contract_smoke.summary.json -Raw -Encoding utf8 | ConvertFrom-Json
          $resourceContractMatrix = Get-Content -LiteralPath ../out/materialized-graph-resource-contract-matrix-smoke/resource_contract_matrix_smoke.summary.json -Raw -Encoding utf8 | ConvertFrom-Json
          $bringupEvidenceMatrix = Get-Content -LiteralPath ../out/materialized-graph-bringup-evidence-matrix-smoke/bringup_evidence_matrix_smoke.summary.json -Raw -Encoding utf8 | ConvertFrom-Json
          $resourceContractCompare = Get-Content -LiteralPath ../out/materialized-graph-resource-contract-compare-smoke/resource_contract_compare_smoke.summary.json -Raw -Encoding utf8 | ConvertFrom-Json
          $bringupEvidenceCompare = Get-Content -LiteralPath ../out/materialized-graph-bringup-evidence-compare-smoke/bringup_evidence_compare_smoke.summary.json -Raw -Encoding utf8 | ConvertFrom-Json
          $resourceContractCompareRoot = Get-Content -LiteralPath ../out/materialized-graph-resource-contract-compare-root-smoke/resource_contract_compare_root_smoke.summary.json -Raw -Encoding utf8 | ConvertFrom-Json
          $bringupEvidenceCompareRoot = Get-Content -LiteralPath ../out/materialized-graph-bringup-evidence-compare-root-smoke/bringup_evidence_compare_root_smoke.summary.json -Raw -Encoding utf8 | ConvertFrom-Json
          $candidateGraph = $summary.candidate.graph_aggregate
          $baselineGraph = if ($summary.baseline) { $summary.baseline.graph_aggregate } else { $null }
          @(
            '## Materialized Graph Observe'
            ''
            "- Baseline: `$($summary.baseline.index)`"
            "- Candidate: `$($summary.candidate.index)`"
            "- Status: `$($summary.status)`"
            "- Has diff: `$($summary.has_diff)`"
            "- Candidate graph: `$('cases={0}, nodes={1}, edges={2}, connection cases={3}' -f $candidateGraph.case_count, $candidateGraph.node_count, $candidateGraph.edge_count, $candidateGraph.connection_case_count)`"
            "- Candidate node kinds: `$(Format-CountMap $candidateGraph.node_kinds)`"
            "- Candidate connection modes: `$(Format-CountMap $candidateGraph.connection_modes)`"
            "- Baseline graph: `$('cases={0}, nodes={1}, edges={2}, connection cases={3}' -f $baselineGraph.case_count, $baselineGraph.node_count, $baselineGraph.edge_count, $baselineGraph.connection_case_count)`"
            "- Baseline node kinds: `$(Format-CountMap $baselineGraph.node_kinds)`"
            "- Baseline connection modes: `$(Format-CountMap $baselineGraph.connection_modes)`"
            "- Changed cases: `$($diff.status_counts.changed)`"
            "- Added cases: `$($diff.status_counts.added)`"
            "- Removed cases: `$($diff.status_counts.removed)`"
            "- Unchanged cases: `$($diff.status_counts.unchanged)`"
            "- Diff JSON: `$($diff.json)`"
            "- Report manifest: `$($summary.report.manifest)`"
            "- Markdown report: `$($summary.report.markdown)`"
            "- HTML report: `$($summary.report.html)`"
            "- Artifact report root: `$($summary.artifact_report.output_root)`"
            "- Artifact report count: `$($summary.artifact_report.count)`"
            "- Runtime plane smoke case: `$($runtimePlane.runtime_case)`"
            "- Runtime plane smoke donor: `$($runtimePlane.graph_donor_case)`"
            "- Runtime plane smoke summary: `../out/materialized-graph-runtime-plane-smoke/runtime_plane_smoke.summary.json`"
            "- Runtime plane smoke diff: `$($runtimePlane.diff_json)`"
            "- Resource contract smoke case: `$($resourceContract.case)`"
            "- Resource contract smoke contract: `$($resourceContract.expected_contract)`"
            "- Resource contract smoke report: `$($resourceContract.report_path)`"
            "- Resource contract smoke summary: `../out/materialized-graph-resource-contract-smoke/resource_contract_smoke.summary.json`"
            "- Resource contract matrix smoke cases: `$($resourceContractMatrix.case_count)`"
            "- Resource contract matrix smoke contract: `$($resourceContractMatrix.expected_contract)`"
            "- Resource contract matrix smoke fact: `$($resourceContractMatrix.expected_fact)`"
            "- Resource contract matrix smoke summary: `../out/materialized-graph-resource-contract-matrix-smoke/resource_contract_matrix_smoke.summary.json`"
            "- Bringup evidence matrix smoke cases: `$($bringupEvidenceMatrix.case_count)`"
            "- Bringup evidence matrix smoke common capability: `$($bringupEvidenceMatrix.expected_common_capability)`"
            "- Bringup evidence matrix smoke block capability: `$($bringupEvidenceMatrix.expected_block_capability)`"
            "- Bringup evidence matrix smoke summary: `../out/materialized-graph-bringup-evidence-matrix-smoke/bringup_evidence_matrix_smoke.summary.json`"
            "- Resource contract compare smoke case: `$($resourceContractCompare.case)`"
            "- Resource contract compare smoke added contract: `$($resourceContractCompare.added_contract)`"
            "- Resource contract compare smoke artifact report: `$($resourceContractCompare.artifact_report)`"
            "- Resource contract compare smoke diff: `$($resourceContractCompare.diff_json)`"
            "- Resource contract compare smoke summary: `../out/materialized-graph-resource-contract-compare-smoke/resource_contract_compare_smoke.summary.json`"
            "- Bringup evidence compare smoke case: `$($bringupEvidenceCompare.case)`"
            "- Bringup evidence compare smoke published capability: `$($bringupEvidenceCompare.published_capability)`"
            "- Bringup evidence compare smoke artifact report: `$($bringupEvidenceCompare.artifact_report)`"
            "- Bringup evidence compare smoke diff: `$($bringupEvidenceCompare.diff_json)`"
            "- Bringup evidence compare smoke summary: `../out/materialized-graph-bringup-evidence-compare-smoke/bringup_evidence_compare_smoke.summary.json`"
            "- Resource contract compare root smoke changed case: `$($resourceContractCompareRoot.changed_case)`"
            "- Resource contract compare root smoke unchanged case: `$($resourceContractCompareRoot.unchanged_case)`"
            "- Resource contract compare root smoke artifact report root: `$($resourceContractCompareRoot.artifact_report_root)`"
            "- Resource contract compare root smoke summary: `../out/materialized-graph-resource-contract-compare-root-smoke/resource_contract_compare_root_smoke.summary.json`"
            "- Bringup evidence compare root smoke changed case: `$($bringupEvidenceCompareRoot.changed_case)`"
            "- Bringup evidence compare root smoke unchanged case: `$($bringupEvidenceCompareRoot.unchanged_case)`"
            "- Bringup evidence compare root smoke artifact report root: `$($bringupEvidenceCompareRoot.artifact_report_root)`"
            "- Bringup evidence compare root smoke summary: `../out/materialized-graph-bringup-evidence-compare-root-smoke/bringup_evidence_compare_root_smoke.summary.json`"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload materialized graph artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materialized-graph-observe-${{ github.run_id }}
          if-no-files-found: error
          path: |
            out/materialized-graph-baseline
            out/materialized-graph-ci
            out/materialized-graph-runtime-plane-smoke
            out/materialized-graph-resource-contract-smoke
            out/materialized-graph-resource-contract-matrix-smoke
            out/materialized-graph-bringup-evidence-matrix-smoke
            out/materialized-graph-resource-contract-compare-smoke
            out/materialized-graph-bringup-evidence-compare-smoke
            out/materialized-graph-resource-contract-compare-root-smoke
            out/materialized-graph-bringup-evidence-compare-root-smoke
