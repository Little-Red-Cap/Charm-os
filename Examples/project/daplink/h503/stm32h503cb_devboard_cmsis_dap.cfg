# External CMSIS-DAP probe for programming the STM32H503CBT6 over SWD.
adapter driver cmsis-dap
transport select swd
adapter speed 1000

if {[catch {source [find target/stm32h5x.cfg]} err]} {
    echo "Error: STM32H5 target support is not available in this OpenOCD package."
    echo "Hint : use ST's OpenOCD build from STM32CubeIDE / STM32CubeCLT."
    echo "Detail: $err"
    shutdown
}
