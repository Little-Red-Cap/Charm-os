name: ssu-submit-gate

on:
  pull_request:

jobs:
  ssu_submit_gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base ref
        shell: bash
        run: git fetch origin "${{ github.base_ref }}" --depth=1
      - name: Run SSU submit gate
        shell: pwsh
        run: ./scripts/ssu_submit_gate.ps1 -DiffRange "origin/${{ github.base_ref }}...HEAD"
