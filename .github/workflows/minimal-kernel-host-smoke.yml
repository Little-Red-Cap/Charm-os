name: minimal-kernel-host-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/minimal-kernel-host-smoke.yml
      - scripts/ci_minimal_kernel_runtime_host_smoke_bundle.ps1
      - scripts/daily_minimal_kernel_runtime_host_smoke_bundle.ps1
      - scripts/minimal_kernel_runtime_host_smoke_bundle.ps1
      - scripts/minimal_kernel_runtime_host_smoke.ps1
      - scripts/minimal_kernel_runtime_host_smoke_ci.ps1
      - scripts/minimal_kernel_runtime_host_smoke_daily.ps1
      - scripts/inspect_minimal_kernel_runtime_host_smoke.ps1
      - scripts/report_minimal_kernel_runtime_host_smoke.ps1
      - scripts/check_minimal_kernel_runtime_host_smoke_summary.ps1
      - Examples/kernel/runtime*_host/**
      - Modules/core/**
      - Modules/io/out/**
      - Modules/system/kernel/**

jobs:
  minimal_kernel_host_smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (CLANG64)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          cache: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-libc++

      - name: Expose CLANG64 tools to PowerShell
        shell: pwsh
        run: |
          $clangBin = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "clang64\bin"
          if (-not (Test-Path $clangBin)) {
            throw "missing CLANG64 bin: $clangBin"
          }

          $clangBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify toolchain
        shell: pwsh
        run: |
          clang++ --version
          cmake --version
          ninja --version

      - name: Run minimal kernel host smoke cold bundle
        shell: pwsh
        run: |
          ./scripts/ci_minimal_kernel_runtime_host_smoke_bundle.ps1 `
            -OutputRoot out/minimal-kernel-runtime-host-smoke-ci `
            -ReportTitle "Minimal Kernel Host Smoke Cold Start Report" `
            -Jobs 8

      - name: Run minimal kernel host smoke warm bundle
        if: success()
        shell: pwsh
        run: |
          ./scripts/daily_minimal_kernel_runtime_host_smoke_bundle.ps1 `
            -OutputRoot out/minimal-kernel-runtime-host-smoke-daily `
            -BaselineSummary out/minimal-kernel-runtime-host-smoke-ci/summary.json `
            -ReportTitle "Minimal Kernel Host Smoke Warm Reuse Report" `
            -Jobs 8

      - name: Publish minimal kernel host smoke summary
        if: always()
        shell: pwsh
        run: |
          $reportPaths = @(
            "out/minimal-kernel-runtime-host-smoke-ci/report.md",
            "out/minimal-kernel-runtime-host-smoke-daily/report.md"
          )

          $published = 0
          foreach ($reportPath in $reportPaths) {
            if (-not (Test-Path $reportPath)) {
              continue
            }

            if ($published -gt 0) {
              "`n---`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }

            Get-Content -LiteralPath $reportPath -Raw -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            $published += 1
          }

          if ($published -eq 0) {
            "## Minimal Kernel Host Smoke`n`n`Report not generated.`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Upload minimal kernel host smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-kernel-runtime-host-smoke
          path: |
            out/minimal-kernel-runtime-host-smoke-ci
            out/minimal-kernel-runtime-host-smoke-daily
          if-no-files-found: error
