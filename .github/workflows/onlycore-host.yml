name: OnlyCore Host

on:
  workflow_dispatch:
  push:
    branches:
      - OnlyCore
  pull_request:
    branches:
      - OnlyCore

jobs:
  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (CLANG64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          cache: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-cmake

      - name: Configure and build root
        shell: msys2 {0}
        run: cmake --fresh -S . -B cmake-build-onlycore-ci -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build root
        shell: msys2 {0}
        run: cmake --build cmake-build-onlycore-ci

      - name: Install Core package
        shell: msys2 {0}
        run: cmake --install cmake-build-onlycore-ci --prefix cmake-build-onlycore-install

      - name: Verify installed Core consumer
        shell: msys2 {0}
        run: |
          cmake --fresh -S Examples/system/charm_core_external_consumer -B cmake-build-onlycore-external-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_PREFIX_PATH="$PWD/cmake-build-onlycore-install"
          cmake --build cmake-build-onlycore-external-consumer
          ctest --test-dir cmake-build-onlycore-external-consumer --output-on-failure

      - name: Verify Core governance
        shell: pwsh
        run: ./scripts/check_charm_core_governance.ps1

      - name: Verify Core relation evidence
        shell: msys2 {0}
        run: |
          cmake --fresh -S Examples/system/charm_capability_relations -B cmake-build-onlycore-relations -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
          cmake --build cmake-build-onlycore-relations
          ctest --test-dir cmake-build-onlycore-relations --output-on-failure

      - name: Verify Core relation compile-time rejection
        shell: msys2 {0}
        run: |
          for target in \
            charm-capability-relations-negative-same_requirement_key \
            charm-capability-relations-negative-same_provision_key \
            charm-capability-relations-negative-same_binding_key; do
            if ! cmake --build cmake-build-onlycore-relations --target help | grep -F "$target: phony"; then
              echo "compile rejection target missing: $target"
              exit 1
            fi
            if cmake --build cmake-build-onlycore-relations --target "$target"; then
              echo "compile rejection failed: $target"
              exit 1
            fi
          done

      - name: Verify MVP Host evidence
        shell: msys2 {0}
        run: |
          cmake --fresh -S Examples/system/charm_capability_mvp -B cmake-build-onlycore-mvp -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
          cmake --build cmake-build-onlycore-mvp
          ctest --test-dir cmake-build-onlycore-mvp --output-on-failure

      - name: Verify portable source boundary
        shell: pwsh
        run: ./Examples/system/charm_capability_mvp/verify_portable_source_boundary.ps1
